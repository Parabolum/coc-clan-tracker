services:
  tracker:
    image: ghcr.io/parabolum/coc-clan-tracker:latest
    pull_policy: always
    container_name: coc-clan-tracker
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/tracker.sqlite3
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - tracker_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tracker_data:
